<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Creador de prompts</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prompts">
<meta name="theme-color" content="#7c3aed">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #ffffff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #7c3aed; --card: #f3f4f6; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0f19; --fg: #f3f4f6; --muted: #9ca3af; --line: #1f2937;
            --accent: #a78bfa; --card: #151b2b; --err: #f87171; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(110px + env(safe-area-inset-bottom, 0px));
    max-width: 600px; margin: 0 auto;
  }
  h1 { margin: 0 0 4px; font-size: 28px; }
  h2 { margin: 26px 0 8px; font-size: 16px; color: var(--muted); font-weight: 600; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  button { font: inherit; cursor: pointer; }

  #types { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  #types::-webkit-scrollbar { display: none; }
  .type {
    flex: none; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font-size: 14px; white-space: nowrap;
  }
  .type.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .fld { margin-top: 14px; }
  .fld label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
  .fld .opt { font-weight: 400; color: var(--muted); }
  input, textarea, select {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); outline: none;
  }
  textarea { resize: vertical; min-height: 76px; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }

  details { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px 14px; }
  summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 14px; }
  .chk { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 15px; }
  .chk input { width: 22px; height: 22px; flex: none; }

  #out { min-height: 160px; font-size: 15px; line-height: 1.5; font-family: ui-monospace, Menlo, monospace; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .bar-in { max-width: 600px; margin: 0 auto; display: flex; gap: 8px; }
  .bar button {
    flex: 1; padding: 13px 8px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font-weight: 600;
  }
  .bar button.main { background: var(--accent); border-color: var(--accent); color: #fff; flex: 2; }
  .bar button:disabled { opacity: .45; }

  .item { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item .txt { flex: 1; min-width: 0; text-align: left; background: none; border: 0; color: inherit; padding: 0; }
  .item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .k { font-size: 13px; color: var(--muted); }
  .item .x { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 6px 8px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0;
    pointer-events: none; transition: opacity .2s; z-index: 6;
  }
  #toast.show { opacity: 1; }
  .go {
    width: 100%; padding: 14px; border: 0; border-radius: 12px; font-weight: 700;
    background: var(--accent); color: #fff;
  }
  .go:disabled { opacity: .5; }
  .exs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; align-items: center; scrollbar-width: none; }
  .exs::-webkit-scrollbar { display: none; }
  .exs .lbl { font-size: 13px; color: var(--muted); flex: none; }
  .ex {
    flex: none; padding: 7px 12px; border-radius: 999px; border: 1px dashed var(--accent);
    background: none; color: var(--accent); font-size: 13px;
  }
  .seg { display: flex; gap: 8px; margin-top: 14px; }
  .seg button {
    flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font-weight: 600;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pick {
    width: 100%; margin-top: 12px; padding: 18px; border-radius: 14px;
    border: 2px dashed var(--line); background: var(--card); color: var(--fg); font-weight: 600;
  }
  .thumbs { display: flex; gap: 6px; overflow-x: auto; margin-top: 12px; }
  .thumbs figure { margin: 0; flex: none; text-align: center; }
  .thumbs img { height: 84px; border-radius: 8px; display: block; }
  .thumbs figcaption { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .an-note { font-size: 13px; color: var(--muted); margin-top: 12px; }
  .an-status { font-size: 14px; margin-top: 10px; min-height: 1.3em; }
  .an-actions { display: flex; gap: 8px; margin-top: 12px; }
  .an-actions .go { flex: 1; width: auto; }
  .stop { padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Creador de prompts</h1>
<p class="sub">Llena lo básico y se arma solo un prompt listo para pegar en cualquier IA.</p>

<div id="types"></div>
<div id="examples" class="exs" hidden></div>
<div id="form"></div>

<details>
  <summary>Opciones avanzadas</summary>
  <div class="fld">
    <label for="role">Rol de la IA <span class="opt">(opcional)</span></label>
    <input id="role" placeholder="Ej.: chef profesional. Si lo dejas vacío, se elige uno según el tipo" autocomplete="off">
  </div>
  <div class="fld">
    <label for="respLang">La IA debe responder en</label>
    <select id="respLang"></select>
  </div>
  <div class="fld">
    <label for="promptLang">Idioma del prompt</label>
    <select id="promptLang"></select>
  </div>
  <label class="chk"><input type="checkbox" id="ask"> Que me haga preguntas si le falta información</label>
</details>

<h2>Tu prompt</h2>
<textarea id="out" placeholder="Completa los campos de arriba y tu prompt aparecerá aquí. Puedes editarlo antes de copiarlo."></textarea>
<div id="count" class="meta"></div>

<div id="lib-box" hidden>
  <h2>Guardados</h2>
  <div id="lib"></div>
</div>

<div class="bar">
  <div class="bar-in">
    <button id="save" disabled>Guardar</button>
    <button id="share" disabled>Compartir</button>
    <button id="copy" class="main" disabled>Copiar prompt</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);

// <build>
// ---------- Opciones (valor, texto en español, texto en inglés) ----------
const OPT = {
  tone: [
    ['', 'Sin preferencia', ''],
    ['neutral', 'Neutral', 'neutral'],
    ['formal', 'Formal', 'formal'],
    ['cercano', 'Cercano y amable', 'friendly and warm'],
    ['divertido', 'Divertido', 'fun and light-hearted'],
    ['tecnico', 'Técnico', 'technical'],
    ['persuasivo', 'Persuasivo', 'persuasive'],
    ['empatico', 'Empático', 'empathetic']
  ],
  format: [
    ['', 'Sin preferencia', ''],
    ['parrafos', 'Párrafos', 'paragraphs'],
    ['vinetas', 'Lista con viñetas', 'a bullet-point list'],
    ['pasos', 'Pasos numerados', 'numbered steps'],
    ['tabla', 'Tabla', 'a table'],
    ['esquema', 'Esquema con títulos', 'an outline with headings']
  ],
  length: [
    ['', 'Sin límite', ''],
    ['corta', 'Corta (un párrafo)', 'short (about one paragraph)'],
    ['media', 'Media (3 a 5 párrafos)', 'medium (3 to 5 paragraphs)'],
    ['larga', 'Larga y detallada', 'long and detailed']
  ],
  detail: [
    ['', 'Sin preferencia', ''],
    ['solo', 'Solo el código', 'code only'],
    ['breve', 'Código con explicación breve', 'code with a short explanation'],
    ['pasos', 'Paso a paso, para aprender', 'step by step, so I can learn']
  ],
  ratio: [
    ['', 'Sin preferencia', ''],
    ['1:1', 'Cuadrado (1:1)', '1:1'],
    ['4:5', 'Retrato (4:5)', '4:5'],
    ['9:16', 'Vertical (9:16)', '9:16'],
    ['16:9', 'Horizontal (16:9)', '16:9']
  ],
  dur: [
    ['', 'Sin preferencia', ''],
    ['5', '5 segundos', '5 seconds'],
    ['10', '10 segundos', '10 seconds'],
    ['15', '15 segundos', '15 seconds'],
    ['30', '30 segundos', '30 seconds'],
    ['60', '1 minuto', '1 minute']
  ],
  n: [
    ['', 'Sin preferencia', ''],
    ['5', '5', '5'],
    ['10', '10', '10'],
    ['20', '20', '20']
  ],
  respLang: [
    ['es', 'Español', 'Spanish'],
    ['en', 'Inglés', 'English'],
    ['pt', 'Portugués', 'Portuguese'],
    ['fr', 'Francés', 'French'],
    ['de', 'Alemán', 'German'],
    ['it', 'Italiano', 'Italian'],
    ['same', 'El mismo idioma de mi mensaje', 'the same language as my message']
  ],
  promptLang: [
    ['es', 'Español', 'Spanish'],
    ['en', 'English', 'English']
  ]
};

// ---------- Campos disponibles ----------
// t: ta = área de texto, in = línea, sel = lista (opt)
const FIELDS = {
  goal:      { t: 'ta',  label: '¿Qué quieres lograr?', ph: '' },
  tipoTexto: { t: 'in',  label: 'Tipo de texto', ph: 'Ej.: publicación para Instagram, discurso, descripción de producto', optional: true },
  source:    { t: 'ta',  label: 'Texto', ph: 'Pega aquí el texto', rows: 6 },
  context:   { t: 'ta',  label: 'Contexto o detalles importantes', ph: 'Datos, situación, lo que la IA debe saber', optional: true },
  audience:  { t: 'in',  label: '¿Para quién es?', ph: 'Ej.: clientes jóvenes, mi jefe, niños de 10 años', optional: true },
  tone:      { t: 'sel', label: 'Tono', opt: 'tone', optional: true },
  format:    { t: 'sel', label: 'Formato de la respuesta', opt: 'format', optional: true },
  length:    { t: 'sel', label: 'Extensión', opt: 'length', optional: true },
  avoid:     { t: 'ta',  label: 'Restricciones o cosas a evitar', ph: 'Ej.: sin tecnicismos, sin emojis, no más de 100 palabras', optional: true },
  example:   { t: 'ta',  label: 'Ejemplo de cómo debe verse el resultado', ph: 'Pega un ejemplo si tienes uno', optional: true },
  lang:      { t: 'in',  label: 'Lenguaje o tecnología', ph: 'Ej.: Python, JavaScript, Excel' },
  detail:    { t: 'sel', label: 'Nivel de detalle', opt: 'detail', optional: true },
  dest:      { t: 'in',  label: 'Destinatario', ph: 'Ej.: mi casero, un cliente, recursos humanos', optional: true },
  sign:      { t: 'in',  label: 'Tu nombre para la firma', ph: '', optional: true },
  from:      { t: 'in',  label: 'Idioma de origen', ph: 'Ej.: inglés (o déjalo vacío para que lo detecte)', optional: true },
  to:        { t: 'in',  label: 'Traducir a', ph: 'Ej.: español de México' },
  n:         { t: 'sel', label: 'Cantidad de ideas', opt: 'n', optional: true },
  estilo:    { t: 'in',  label: 'Estilo', ph: 'Ej.: acuarela, fotografía realista, anime, 3D', optional: true },
  encuadre:  { t: 'in',  label: 'Encuadre', ph: 'Ej.: primer plano, vista aérea, plano general', optional: true },
  luz:       { t: 'in',  label: 'Iluminación', ph: 'Ej.: luz de atardecer, neón, luz suave de estudio', optional: true },
  colores:   { t: 'in',  label: 'Colores', ph: 'Ej.: tonos cálidos, azul y dorado', optional: true },
  ratio:     { t: 'sel', label: 'Formato de la imagen', opt: 'ratio', optional: true },
  camara:    { t: 'in',  label: 'Movimiento de cámara', ph: 'Ej.: travelling lento hacia adelante, cámara fija, toma aérea con dron', optional: true },
  duracion:  { t: 'sel', label: 'Duración', opt: 'dur', optional: true },
  sonido:    { t: 'in',  label: 'Sonido o música', ph: 'Ej.: música suave de guitarra, sonido ambiente, sin diálogo', optional: true }
};

// ---------- Tipos de prompt ----------
const TYPES = {
  texto: {
    name: '✍️ Escribir', roleEs: 'un redactor profesional con experiencia', roleEn: 'an experienced professional writer',
    fields: ['goal', 'tipoTexto', 'context', 'audience', 'tone', 'format', 'length', 'avoid', 'example'],
    over: { goal: { label: '¿Qué quieres que escriba?', ph: 'Ej.: la presentación de mi cafetería para redes sociales' } },
    req: ['goal']
  },
  resumir: {
    name: '📄 Resumir', roleEs: 'un analista experto en síntesis de información', roleEn: 'an analyst who is an expert at summarizing information',
    fields: ['source', 'goal', 'audience', 'format', 'length', 'avoid'],
    over: { source: { label: 'Texto a resumir' }, goal: { label: '¿Qué te interesa del resumen?', ph: 'Ej.: solo las fechas y decisiones', optional: true } },
    req: ['source']
  },
  explicar: {
    name: '🎓 Explicar', roleEs: 'un profesor paciente y claro', roleEn: 'a patient, clear teacher',
    fields: ['goal', 'context', 'audience', 'tone', 'format', 'length', 'avoid'],
    over: { goal: { label: '¿Qué quieres entender?', ph: 'Ej.: cómo funciona la inflación' }, audience: { label: 'Tu nivel', ph: 'Ej.: principiante, sé lo básico, soy estudiante de prepa' } },
    req: ['goal']
  },
  codigo: {
    name: '💻 Código', roleEs: 'un programador senior', roleEn: 'a senior software engineer',
    fields: ['goal', 'lang', 'context', 'detail', 'avoid', 'example'],
    over: { goal: { label: '¿Qué necesitas que haga el código?', ph: 'Ej.: una función que ordene una lista de contactos por apellido' }, context: { label: 'Código existente o detalles', ph: 'Pega tu código o los datos de entrada' } },
    req: ['goal']
  },
  correo: {
    name: '✉️ Mensaje', roleEs: 'un experto en comunicación escrita', roleEn: 'an expert in written communication',
    fields: ['goal', 'dest', 'sign', 'context', 'tone', 'length', 'avoid'],
    over: { goal: { label: '¿Qué quieres decir?', ph: 'Ej.: pedir una prórroga para pagar la renta' } },
    req: ['goal']
  },
  traducir: {
    name: '🌐 Traducir', roleEs: 'un traductor profesional', roleEn: 'a professional translator',
    fields: ['source', 'from', 'to', 'tone', 'avoid'],
    over: { source: { label: 'Texto a traducir' } },
    req: ['source', 'to']
  },
  ideas: {
    name: '💡 Ideas', roleEs: 'un consultor creativo', roleEn: 'a creative consultant',
    fields: ['goal', 'n', 'context', 'audience', 'tone', 'avoid'],
    over: { goal: { label: '¿Sobre qué quieres ideas?', ph: 'Ej.: nombres para mi tienda de plantas' } },
    req: ['goal']
  },
  imagen: {
    name: '🎨 Imagen', roleEs: '', roleEn: '',
    fields: ['goal', 'estilo', 'encuadre', 'luz', 'colores', 'ratio', 'avoid'],
    over: { goal: { label: '¿Qué quieres ver en la imagen?', ph: 'Ej.: un gato naranja durmiendo en una biblioteca antigua' }, avoid: { label: 'Qué no debe aparecer', ph: 'Ej.: texto, marcas de agua, manos deformes' } },
    req: ['goal']
  },
  video: {
    name: '🎬 Video', roleEs: '', roleEn: '',
    fields: ['goal', 'estilo', 'camara', 'encuadre', 'luz', 'colores', 'duracion', 'ratio', 'sonido', 'avoid'],
    over: {
      goal: { label: '¿Qué escena quieres ver?', ph: 'Ej.: un dron sobrevuela un pueblo en la sierra al amanecer' },
      ratio: { label: 'Formato del video' },
      avoid: { label: 'Qué no debe aparecer', ph: 'Ej.: texto en pantalla, marcas de agua, cortes bruscos' }
    },
    req: ['goal']
  },
  libre: {
    name: '🧩 Libre', roleEs: 'un asistente experto en el tema', roleEn: 'an expert assistant on the topic',
    fields: ['goal', 'context', 'audience', 'tone', 'format', 'length', 'avoid', 'example'],
    over: { goal: { label: '¿Qué necesitas?', ph: 'Describe tu tarea con tus palabras' } },
    req: ['goal']
  }
};

// ---------- Textos del prompt ----------
const ES = {
  act: r => `Actúa como ${r}.`,
  h: { goal: 'Objetivo', tipoTexto: 'Tipo de texto', source: 'Texto', context: 'Contexto', audience: 'Público',
       tone: 'Tono', format: 'Formato de la respuesta', length: 'Extensión', avoid: 'Restricciones (qué evitar)',
       example: 'Ejemplo del resultado esperado', lang: 'Lenguaje o tecnología', detail: 'Nivel de detalle',
       dest: 'Destinatario', sign: 'Firma', from: 'Idioma de origen', to: 'Idioma de destino', n: 'Cantidad de ideas',
       instr: 'Instrucciones' },
  respond: l => `Responde en ${l}.`,
  ask: 'Si te falta información importante, hazme preguntas antes de responder.',
  instr: {
    resumir: 'Resume conservando las ideas principales y sin añadir información que no esté en el texto.',
    explicar: 'Explica con ejemplos sencillos y evita la jerga innecesaria.',
    codigo: 'Escribe código claro y funcional. Indica cómo ejecutarlo si hace falta.',
    correo: 'Entrega el mensaje listo para enviar, con asunto si es un correo.',
    traducir: 'Traduce de forma natural, conservando el sentido y el tono. No agregues comentarios.',
    ideas: 'Entrega ideas variadas y concretas, no genéricas.'
  },
  img: { make: 'Crea una imagen de', style: 'Estilo', frame: 'Encuadre', light: 'Iluminación', colors: 'Colores', ratio: 'Formato', avoid: 'Evita' },
  vid: { make: 'Crea un video de', style: 'Estilo', camera: 'Movimiento de cámara', frame: 'Encuadre', light: 'Iluminación', colors: 'Colores', dur: 'Duración', ratio: 'Formato', sound: 'Sonido', avoid: 'Evita' }
};
const EN = {
  act: r => `Act as ${r}.`,
  h: { goal: 'Goal', tipoTexto: 'Type of text', source: 'Text', context: 'Context', audience: 'Audience',
       tone: 'Tone', format: 'Response format', length: 'Length', avoid: 'Constraints (what to avoid)',
       example: 'Example of the expected result', lang: 'Language or technology', detail: 'Level of detail',
       dest: 'Recipient', sign: 'Signature', from: 'Source language', to: 'Target language', n: 'Number of ideas',
       instr: 'Instructions' },
  respond: l => `Respond in ${l}.`,
  ask: 'If you are missing important information, ask me questions before answering.',
  instr: {
    resumir: 'Summarize keeping the main ideas and without adding information that is not in the text.',
    explicar: 'Explain with simple examples and avoid unnecessary jargon.',
    codigo: 'Write clear, working code. Explain how to run it if needed.',
    correo: 'Deliver the message ready to send, with a subject line if it is an email.',
    traducir: 'Translate naturally, keeping the meaning and tone. Do not add comments.',
    ideas: 'Give varied, concrete ideas, not generic ones.'
  },
  img: { make: 'Create an image of', style: 'Style', frame: 'Framing', light: 'Lighting', colors: 'Colors', ratio: 'Aspect ratio', avoid: 'Avoid' },
  vid: { make: 'Create a video of', style: 'Style', camera: 'Camera movement', frame: 'Framing', light: 'Lighting', colors: 'Colors', dur: 'Duration', ratio: 'Aspect ratio', sound: 'Sound', avoid: 'Avoid' }
};

// ---------- Armado del prompt ----------
function optLabel(key, value, en) {
  const o = OPT[key].find(x => x[0] === value);
  return o && o[0] ? (en ? o[2] : o[1]) : '';
}

function isReady(k, v) {
  return TYPES[k].req.every(id => (v[id] || '').trim());
}

function build(k, v) {
  const t = TYPES[k];
  const en = v.promptLang === 'en';
  const S = en ? EN : ES;
  const g = id => (v[id] || '').trim();

  if (k === 'imagen') {
    const bits = [`${S.img.make}: ${g('goal')}`];
    if (g('estilo')) bits.push(`${S.img.style}: ${g('estilo')}`);
    if (g('encuadre')) bits.push(`${S.img.frame}: ${g('encuadre')}`);
    if (g('luz')) bits.push(`${S.img.light}: ${g('luz')}`);
    if (g('colores')) bits.push(`${S.img.colors}: ${g('colores')}`);
    const r = optLabel('ratio', v.ratio, en);
    if (r) bits.push(`${S.img.ratio}: ${r}`);
    if (g('avoid')) bits.push(`${S.img.avoid}: ${g('avoid')}`);
    return bits.join('. ') + '.';
  }

  if (k === 'video') {
    const V = S.vid;
    const bits = [`${V.make}: ${g('goal')}`];
    if (g('estilo')) bits.push(`${V.style}: ${g('estilo')}`);
    if (g('camara')) bits.push(`${V.camera}: ${g('camara')}`);
    if (g('encuadre')) bits.push(`${V.frame}: ${g('encuadre')}`);
    if (g('luz')) bits.push(`${V.light}: ${g('luz')}`);
    if (g('colores')) bits.push(`${V.colors}: ${g('colores')}`);
    const d = optLabel('dur', v.duracion, en);
    if (d) bits.push(`${V.dur}: ${d}`);
    const r = optLabel('ratio', v.ratio, en);
    if (r) bits.push(`${V.ratio}: ${r}`);
    if (g('sonido')) bits.push(`${V.sound}: ${g('sonido')}`);
    if (g('avoid')) bits.push(`${V.avoid}: ${g('avoid')}`);
    return bits.join('. ') + '.';
  }

  const role = g('role') || (en ? t.roleEn : t.roleEs);
  const out = [S.act(role)];

  // valor de cada campo, ya listo para mostrar
  const value = id => {
    const def = FIELDS[id];
    if (def.t === 'sel') return optLabel(def.opt, v[id], en);
    if (id === 'source') return g('source') ? '"""\n' + g('source') + '\n"""' : '';
    return g(id);
  };
  const sec = id => {
    const body = value(id);
    return body ? `## ${S.h[id]}\n${body}` : '';
  };

  t.fields.forEach(id => { const s = sec(id); if (s) out.push(s); });

  // instrucciones finales
  const instr = [];
  if (S.instr[k]) instr.push(S.instr[k]);
  if (k !== 'traducir' && v.respLang) {
    const rl = optLabel('respLang', v.respLang, en);
    instr.push(S.respond(en ? rl : rl.toLowerCase()));
  }
  if (v.ask) instr.push(S.ask);
  if (instr.length) out.push(`## ${S.h.instr}\n` + instr.map(x => '- ' + x).join('\n'));

  return out.join('\n\n');
}

function ratioLabel(w, h) {
  const r = w / h;
  const c = [['16:9', 16 / 9], ['9:16', 9 / 16], ['1:1', 1], ['4:3', 4 / 3], ['3:4', 3 / 4],
             ['4:5', 4 / 5], ['21:9', 21 / 9], ['3:2', 3 / 2], ['2:3', 2 / 3]];
  let best = c[0], d = Infinity;
  for (const x of c) { const e = Math.abs(r - x[1]); if (e < d) { d = e; best = x; } }
  return d < 0.03 ? best[0] : `${w}:${h}`;
}

function analysisPrompt(mode, meta, extra, en) {

    'No identifiques a personas reales ni menciones su parecido con alguien; descríbelas en general (edad aproximada, ropa, pose, expresión).',
    'Si hay texto legible, escríbelo entre comillas.',
    'Redáctalo como una instrucción directa para el generador: no digas “la imagen”, “el video” ni “los fotogramas”.',
    `Escribe el resultado en ${out}.`
  ].map(r => '- ' + r).join('\n');
  const change = extra ? `\nAdemás, aplica este cambio respecto al original: ${extra}\n` : '';

  if (mode === 'imagen') {
    return `Eres un experto en escribir prompts para generadores de imágenes con IA.
Mira la imagen adjunta y escribe UN prompt que permita recrearla lo más fielmente posible.
Incluye, de forma concreta y ordenada: sujeto(s) y su apariencia; acción o pose; entorno y fondo; composición (tipo de plano, ángulo, lente o profundidad de campo); iluminación; paleta de colores; estilo o medio visual (fotografía, óleo, 3D, anime, etc.); texturas y detalles; ambiente emocional; relación de aspecto aproximada.
${change}
Reglas:
${rules}

Formato de respuesta: primero el prompt completo en un solo bloque de texto, sin títulos ni introducción. Después, en una línea nueva que empiece con "${neg}", una lista corta de cosas que conviene evitar para no desviarse del original.`;
  }

  const m = meta || {};

    : `Te paso ${m.shots || 'varias'} capturas del mismo video, en orden cronológico.`;
  const data = m.dur
    ? `Datos del video: duración ${m.dur} s; formato ${ratioLabel(m.w, m.h)} (${m.w}×${m.h}).`
    : '';
  return `Eres un experto en escribir prompts para generadores de video con IA (como Sora, Veo, Runway o Kling).
${intro}
${data}
Escribe UN prompt que permita recrear el video lo más fielmente posible. Incluye, de forma concreta: sujeto(s) y apariencia; escenario; la acción y cómo evoluciona con el tiempo (por tramos, con los segundos aproximados); movimiento de cámara (deducido al comparar los fotogramas: fijo, paneo, travelling, zoom, dron, etc.); encuadre y tipo de plano; iluminación; paleta de colores; estilo visual; ritmo (plano continuo o cortes); duración y formato.
No puedes oír el audio ni ver lo que ocurre entre fotogramas. Cuando algo sea una deducción, exprésalo con prudencia ("parece que…"). Cierra el prompt con una línea "${snd}" que proponga un ambiente sonoro coherente con la escena, aclarando que es una sugerencia.

async function copyText(text) {

    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();

    ta.remove();
  }
}

const ANALYZE_NAME = '🔍 Desde imagen o video';
let SAMPLE = null;
let SAMPLE_IMAGES = 0;
let analysis = { text: '' };
const an = { mode: 'imagen', blobs: [], thumbs: [], times: null, meta: null, busy: false, ctl: null };

async function initSample() {
  try {
    if (window.claude && window.claude.use) {
      const s = await window.claude.use('sample');
      if (s) {
        SAMPLE = s;
        try {
          const lim = await s.limits();
          SAMPLE_IMAGES = lim && lim.images ? lim.images.maxCount : 0;
        } catch (e) { SAMPLE_IMAGES = 0; }
      }
    }
  } catch (e) { /* sin Claude */ }
  if (cur === 'analizar') renderForm();
}

function setProgress(t) {
  const el = document.getElementById('an-status');
  if (el) el.textContent = t || '';
}

function waitFor(el, evt, ms) {
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, ms);
    const ok = () => { cleanup(); resolve(); };
    const bad = () => { cleanup(); reject(new Error('error')); };
    function cleanup() {
      clearTimeout(t);
      el.removeEventListener(evt, ok);
      el.removeEventListener('error', bad);
    }
    el.addEventListener(evt, ok);
    el.addEventListener('error', bad);
  });
}

function toJpeg(source, sw, sh, maxSide, q) {
  const scale = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * scale));
  const h = Math.max(1, Math.round(sh * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(source, 0, 0, w, h);
  return new Promise((resolve, reject) =>
    c.toBlob(b => (b ? resolve(b) : reject(new Error('toBlob'))), 'image/jpeg', q));
}

function thumbOf(source, sw, sh) {
  const scale = Math.min(1, 180 / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * scale));
  c.height = Math.max(1, Math.round(sh * scale));
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.6);
}

function readDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('read'));
    r.readAsDataURL(file);
  });
}

async function loadImage(file) {
  const img = new Image();
  img.src = await readDataUrl(file);
  if (!img.complete) await waitFor(img, 'load', 15000);
  if (!img.naturalWidth) throw new Error('decode');
  return img;
}

// Toma n fotogramas repartidos a lo largo del video, sin subir el video a ninguna parte
async function extractFrames(file, n) {
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.muted = true;
  v.playsInline = true;
  v.preload = 'auto';
  v.setAttribute('playsinline', '');
  v.src = url;
  try {
    v.load();
    await waitFor(v, 'loadeddata', 20000);
    const dur = v.duration;
    if (!isFinite(dur) || dur <= 0) throw new Error('duration');
    const w = v.videoWidth, h = v.videoHeight;
    const frames = [], thumbs = [], times = [];
    for (let i = 0; i < n; i++) {
      const t = Math.min(dur - 0.05, Math.max(0, ((i + 0.5) / n) * dur));
      const seek = waitFor(v, 'seeked', 8000);
      v.currentTime = t;
      await seek;
      frames.push(await toJpeg(v, w, h, 1024, 0.85));
      thumbs.push(thumbOf(v, w, h));
      times.push(Math.round(t * 10) / 10);
      setProgress(`Preparando fotogramas… ${i + 1}/${n}`);
    }
    return { frames, thumbs, times, meta: { dur: Math.round(dur * 10) / 10, w, h, times } };
  } finally {
    URL.revokeObjectURL(url);
    v.removeAttribute('src');
    v.load();
  }
}

async function prepare(files) {
  an.blobs = []; an.thumbs = []; an.times = null; an.meta = null;
  renderThumbs();
  const max = Math.max(1, Math.min(SAMPLE_IMAGES || 1, 8));
  const isVideo = an.mode === 'video' && files[0].type.startsWith('video/');
  setProgress('Preparando…');
  try {
    if (an.mode === 'imagen') {
      const img = await loadImage(files[0]);
      an.blobs = [await toJpeg(img, img.naturalWidth, img.naturalHeight, 1600, 0.88)];
      an.thumbs = [thumbOf(img, img.naturalWidth, img.naturalHeight)];
    } else if (isVideo) {
      const r = await extractFrames(files[0], max);
      an.blobs = r.frames; an.thumbs = r.thumbs; an.times = r.times; an.meta = r.meta;
    } else {
      for (const f of files.slice(0, max)) {
        const img = await loadImage(f);
        an.blobs.push(await toJpeg(img, img.naturalWidth, img.naturalHeight, 1024, 0.85));
        an.thumbs.push(thumbOf(img, img.naturalWidth, img.naturalHeight));
      }
      an.meta = { shots: an.blobs.length };
    }
    setProgress('');
  } catch (e) {
    an.blobs = []; an.thumbs = []; an.times = null; an.meta = null;
    setProgress(isVideo
      ? 'No pude abrir ese video aquí. Prueba subiendo capturas de pantalla del video, en orden.'
      : 'No pude abrir ese archivo. Prueba con otra imagen (JPG o PNG).');
  }
  renderThumbs();
  refreshAnalyzeButtons();
}

function renderThumbs() {
  const box = document.getElementById('an-thumbs');

  box.innerHTML = '';

    const fig = document.createElement('figure');

    fig.appendChild(im);
    if (an.times) {
      const cap = document.createElement('figcaption');
      cap.textContent = an.times[i] + ' s';
      fig.appendChild(cap);
    }
    box.appendChild(fig);
  });
}

function refreshAnalyzeButtons() {
  const go = document.getElementById('an-go');
  const stop = document.getElementById('an-stop');

function errorCopy(code) {
  switch (code) {
    case 'not_granted': return 'Para analizar necesitas permitir que esta página use a Claude. Vuelve a tocar el botón y acepta el aviso.';
    case 'sampling_disabled': return 'Claude no está disponible en tu cuenta para esta función.';
    case 'rate_limited': return 'Llegaste a un límite de uso o hiciste demasiados intentos. Espera un momento e inténtalo de nuevo.';
    case 'image_rejected': return 'Claude no aceptó esa imagen. Prueba con otra (JPG o PNG).';
    case 'images_unavailable': return 'Esta vista no permite enviar imágenes a Claude.';
    case 'refused': return 'Claude no pudo analizar este contenido. Prueba con otro.';
    case 'session_expired': return 'Tu sesión de Claude venció. Vuelve a iniciarla e inténtalo otra vez.';
    default: return 'Algo falló al analizar. Intenta de nuevo.';
  }
}

async function analyze() {
  if (!SAMPLE || !an.blobs.length || an.busy) return;
  an.busy = true;
  an.ctl = new AbortController();
  $('out').value = '';
  analysis.text = '';
  refreshAnalyzeButtons();
  update(); // desactiva copiar, compartir y guardar mientras se escribe
  setProgress('Pensando…');
  const extraEl = document.getElementById('an-extra');
  const prompt = analysisPrompt(an.mode, an.meta, extraEl ? extraEl.value.trim() : '', vals.promptLang === 'en');
  try {
    const res = await SAMPLE(prompt, {
      images: an.blobs,
      modelTier: 'default',
      signal: an.ctl.signal,
      onText: ({ text }) => { $('out').value = text; setProgress('Escribiendo…'); }
    });
    analysis.text = res.text.trim();
    $('out').value = analysis.text;
    setProgress(res.truncated
      ? 'El prompt salió cortado. Prueba con algo más sencillo.'
      : 'Listo. Puedes editarlo antes de copiarlo.');
  } catch (e) {
    const code = e && e.code;
    if (code === 'cancelled') {
      $('out').value = (e && e.text) || '';
      analysis.text = $('out').value;
      setProgress('Detenido.');
    } else {
      $('out').value = '';
      setProgress(errorCopy(code));
    }
  } finally {
    an.busy = false;
    an.ctl = null;
    refreshAnalyzeButtons();
    update();
  }
}

function renderAnalyzer() {
  const box = $('form');
  box.innerHTML = '';
  const note = t => {
    const d = document.createElement('div');
    d.className = 'an-note';
    d.textContent = t;
    return d;
  };

  if (!SAMPLE || !SAMPLE_IMAGES) {
    box.appendChild(note(
      'Esta función usa a Claude para mirar tu imagen o video y escribir el prompt que sirva para recrearlo. ' +
      'Solo está disponible cuando abres esta página dentro de Claude. En la versión de GitHub no funciona.'));
    return;
  }

  const seg = document.createElement('div');
  seg.className = 'seg';
  [['imagen', '📷 Imagen'], ['video', '🎞️ Video']].forEach(([m, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = an.mode === m ? 'on' : '';
    b.addEventListener('click', () => {
      if (an.busy) return;
      an.mode = m;
      an.blobs = []; an.thumbs = []; an.times = null; an.meta = null;
      renderAnalyzer();
    });
    seg.appendChild(b);
  });
  box.appendChild(seg);

  const input = document.createElement('input');
  input.type = 'file';
  input.hidden = true;
  input.accept = an.mode === 'imagen' ? 'image/*' : 'video/*,image/*';
  input.multiple = an.mode === 'video';
  input.addEventListener('change', () => {
    const files = [...input.files];
    input.value = '';
    if (files.length) prepare(files);
  });
  const pick = document.createElement('button');
  pick.className = 'pick';
  pick.textContent = an.mode === 'imagen' ? 'Elegir una imagen' : 'Elegir un video (o varias capturas)';
  pick.addEventListener('click', () => { if (!an.busy) input.click(); });
  box.append(input, pick);

  const thumbs = document.createElement('div');
  thumbs.id = 'an-thumbs';
  thumbs.className = 'thumbs';
  box.appendChild(thumbs);

  const fld = document.createElement('div');
  fld.className = 'fld';
  const lab = document.createElement('label');
  lab.textContent = 'Cambio o detalle a resaltar ';
  const opt = document.createElement('span');
  opt.className = 'opt';
  opt.textContent = '(opcional)';
  lab.appendChild(opt);
  const extra = document.createElement('input');
  extra.id = 'an-extra';
  extra.autocomplete = 'off';
  extra.placeholder = 'Ej.: igual, pero de noche y en estilo anime';
  fld.append(lab, extra);
  box.appendChild(fld);

  const actions = document.createElement('div');
  actions.className = 'an-actions';
  const go = document.createElement('button');
  go.id = 'an-go';
  go.className = 'go';
  go.textContent = 'Analizar y crear prompt';
  go.disabled = true;
  go.addEventListener('click', analyze);
  const stop = document.createElement('button');
  stop.id = 'an-stop';
  stop.className = 'stop';
  stop.textContent = 'Detener';
  stop.hidden = true;
  stop.addEventListener('click', () => { if (an.ctl) an.ctl.abort(); });
  actions.append(go, stop);
  box.appendChild(actions);

  const st = document.createElement('div');
  st.id = 'an-status';
  st.className = 'an-status';
  box.appendChild(st);

  box.appendChild(note(
    'Se envía la imagen (o unos 8 fotogramas del video) a Claude, con tu cuenta, y gasta parte de tu uso. ' +
    'El video completo no se sube a ningún lado. Claude no oye el audio, y el movimiento de cámara lo deduce comparando fotogramas, ' +
    'así que el resultado es una muy buena base para ajustar, no una copia exacta.'));

  renderThumbs();
  refreshAnalyzeButtons();
}

// ---------- Inicio ----------
(function init() {
  const saved = load(STATE_KEY, null);
  if (saved && (saved.cur in TYPES || saved.cur === 'analizar')) {
    cur = saved.cur;
    vals = Object.assign(vals, saved.vals || {});
  }
  lib = load(LIB_KEY, []);
  syncAdvanced();
  renderTypes();
  renderForm();
  renderExamples();
  renderLib();
  update();
  initSample();
})();
</script>
</body>
</html>
